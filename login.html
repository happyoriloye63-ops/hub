
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudentHub - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- LOGIN CONTAINER -->

    <div class="login-container">


        <!-- LOGIN BOX -->

        <div class="login-box">


            <!-- ICON -->

            <div class="login-icon">
                🎓
            </div>


            <!-- TITLE -->

            <h1>
                Welcome Back!
            </h1>


            <p>
                Login to your StudentHub account
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <button type="submit">
                    Login 🚀
                </button>


            </form>


            <!-- SIGNUP LINK -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <!-- HOME LINK -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
