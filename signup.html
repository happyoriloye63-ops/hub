    
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudentHub - Signup</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- SIGNUP CONTAINER -->

    <div class="login-container">


        <!-- SIGNUP BOX -->

        <div class="login-box">


            <!-- ICON -->

            <div class="login-icon">
                🎓
            </div>


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <p>
                Join StudentHub and start learning
            </p>


            <!-- SIGNUP FORM -->

            <form id="signupForm">


                <!-- FULL NAME -->

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <!-- CONFIRM PASSWORD -->

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >


                <!-- SIGNUP BUTTON -->

                <button type="submit">
                    Create Account 🚀
                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- HOME LINK -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
